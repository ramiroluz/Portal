[project]
name = "camara-de-curitiba-portal"
dynamic = ["version"]
description = "Portal da Câmara de Curitiba"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Câmara de Curitiba", email = "dtic@cmc.pr.gov.br" },
]

[tool.hatch.version]
path = "src/camara_de_curitiba/src/camara_de_curitiba/__init__.py"

[tool.pytest.ini_options]
addopts = "--cov-report term --cov=camara_de_curitiba"
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
force_alphabetical_sort = true
force_single_line = true
lines_after_imports = 2
line_length = 88

[tool.flakeheaven]
format="grouped"
max_line_length=88
show_source=true
max-complexity=25

[tool.flakeheaven.plugins]
pycodestyle = ["+*"]
pyflakes = ["+*"]
"flake8-*" = ["+*"]

[tool.flake8]
format="grouped"
max-line-length=88
show_source=true
max-complexity=25

[tool.plone-code-analysis]
paths = "src/camara_de_curitiba/setup.py src/camara_de_curitiba/src/ scripts/"
paths_pyroma = "src/camara_de_curitiba"
